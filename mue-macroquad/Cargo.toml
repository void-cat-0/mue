[package]
name = "mue-macroquad"
version = "0.1.0"
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
doctest = true

[dependencies]
bitflags = "2.11.0"
cosmic-text = { workspace = true }
glam = "0.32.1"
guillotiere = "0.7.0"
indexmap = "2.13.0"
lyon = "1.0.19"
macroquad = { workspace = true }
miniquad = { workspace = true }
mue-core = { workspace = true, features = ["impl-taffy", "impl-cosmic-text"] }
mue-macros = { workspace = true }
ordered-float = "5.3.0"
paste = "1.0.15"
roxmltree = "0.20"
slotmap = { workspace = true }
smallvec = { workspace = true }
taffy = { workspace = true }
unicode-segmentation = "1.12"
thiserror.workspace = true

# UI sounds (feature "sound"): cpal on desktop and iOS, oboe on Android.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
sasa = { git = "https://github.com/Mivik/sasa", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
sasa = { git = "https://github.com/Mivik/sasa", optional = true, default-features = false, features = ["oboe"] }

[features]
default = []
# Play built-in UI sounds (and application samples) through sasa.
sound = ["dep:sasa"]
