[workspace]
members = [
    "mue-core",
    "mue-macros",
    "mue-macroquad",

    "examples/basics",
    "examples/events",
    "examples/pages",
    "examples/tab",
]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2024"
repository = "https://github.com/void-cat-0/mue-core"
rust-version = "1.89.0"

[workspace.dependencies]
macroquad = { git = "https://github.com/2278535805/macroquad", default-features = false }
miniquad = { git = "https://github.com/2278535805/miniquad" }
cosmic-text = "0.18.2"
slotmap = "1.1.1"
smallvec = "1.13.2"
taffy = "0.9.2"

mue-core = { path = "mue-core" }
mue-macros = { path = "mue-macros" }
mue-macroquad = { path = "mue-macroquad" }
