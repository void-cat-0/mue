[workspace]
members = [
    "mue-core",
    "mue-macros",
    "mue-macroquad",
    "mue-components",

    "examples/atlas",
    "examples/basics",
    "examples/events",
    "examples/gestures",
    "examples/map",
    "examples/pages",
    "examples/tab",
    "examples/theme",
    "examples/style",
    "examples/color",
    "examples/document",
    "examples/animation",
    "examples/navigation",
    "examples/nodes",
    "examples/playground",
]
# vendor/ 下的 macroquad / miniquad 仅作为 path 依赖使用，不作为工作区成员，
# 否则它们自己的 dev-dependencies 等会被一并解析进 Cargo.lock。
exclude = ["vendor"]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2024"
repository = "https://github.com/void-cat-0/mue-core"
rust-version = "1.89.0"

[workspace.dependencies]
# 临时方案：原仓库 github.com/2278535805 已 404，改为引用从 Cargo 缓存提取的本地副本，
# 详见 vendor/README.md。
macroquad = { path = "vendor/macroquad", default-features = false }
miniquad = { path = "vendor/miniquad" }
cosmic-text = "0.18.2"
slotmap = "1.1.1"
smallvec = "1.13.2"
taffy = "0.9.2"

mue-core = { path = "mue-core" }
mue-macros = { path = "mue-macros" }
mue-macroquad = { path = "mue-macroquad" }
mue-components = { path = "mue-components" }

[profile.release]
debug = true