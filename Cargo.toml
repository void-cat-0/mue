[workspace]
members = [
    "mue-core",
    "mue-macros",
    "mue-macroquad",
    "mue-components",

    "examples/atlas",
    "examples/basics",
    "examples/events",
    "examples/gestures",
    "examples/map",
    "examples/pages",
    "examples/tab",
    "examples/theme",
    "examples/style",
    "examples/color",
    "examples/document",
    "examples/animation",
    "examples/nodes",
    "examples/portal",
    "examples/pass-probe",
    "examples/material-probe",
    "examples/input-router",
    "examples/input-timing",
    "examples/scenes",
    "examples/scene-flow",
    "examples/scene-transitions",
    "examples/song-transition",
    "examples/playground",
    "examples/tokens",
]
# vendor/ 下的 macroquad / miniquad 仅作为 path 依赖使用，不作为工作区成员，
# 否则它们自己的 dev-dependencies 等会被一并解析进 Cargo.lock。
exclude = ["vendor"]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2024"
repository = "https://github.com/void-cat-0/mue-core"
rust-version = "1.90.0"

[workspace.dependencies]
macroquad = { git = "https://github.com/void-cat-0/macroquad", default-features = false }
miniquad = { git = "https://github.com/void-cat-0/miniquad" }
cosmic-text = "0.18.2"
slotmap = "1.1.1"
smallvec = "1.13.2"
taffy = "0.9.2"

mue-core = { path = "mue-core" }
mue-macros = { path = "mue-macros" }
mue-macroquad = { path = "mue-macroquad" }
mue-components = { path = "mue-components" }

[profile.release]
debug = true
