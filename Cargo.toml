[workspace]
members = [
    "mue",
    "mue-core",
    "mue-macros",
    "mue-macroquad",
    "mue-components",
    "mue-i18n",
]
exclude = ["examples"]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2024"
repository = "https://github.com/void-cat-0/mue"
rust-version = "1.90.0"

[workspace.dependencies]
macroquad = { git = "https://github.com/void-cat-0/macroquad", default-features = false }
miniquad = { git = "https://github.com/void-cat-0/miniquad" }
cosmic-text = "0.18.2"
slotmap = "1.1.1"
smallvec = "1.13.2"
taffy = "0.9.2"
thiserror = "2.0"

mue-core = { path = "mue-core" }
mue-macros = { path = "mue-macros" }
mue-macroquad = { path = "mue-macroquad" }
mue-components = { path = "mue-components" }
mue-i18n = { path = "mue-i18n" }

[profile.release]
debug = true
