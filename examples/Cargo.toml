[package]
name = "mue-examples"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
resolver = "2"
members = ["tools"]

[profile.release]
debug = true

[features]
vulkan = ["mue/vulkan", "dep:ash"]
phira-autoplay = ["dep:image", "dep:jni", "dep:ndk-context", "dep:sasa", "dep:serde", "dep:serde_json", "dep:serde_yaml", "dep:zip"]
phira-autoplay-vulkan-preferred = ["phira-autoplay", "vulkan"]
phira-autoplay-vulkan-only = ["phira-autoplay-vulkan-preferred"]

[dependencies]
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
zip = { version = "8.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
cosmic-text = "0.18.2"
macroquad = { path = "../../macroquad", default-features = false }
miniquad = { path = "../../miniquad" }
mue = { path = "../mue" }
mue-components = { path = "../mue-components" }
mue-core = { path = "../mue-core" }
mue-i18n = { path = "../mue-i18n" }
mue-macroquad = { path = "../mue-macroquad" }
mue-macros = { path = "../mue-macros" }
taffy = "0.9.2"
thiserror = "2.0"

[target.'cfg(any(windows, target_os = "android", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
ash = { version = "0.37", default-features = false, features = ["loaded"], optional = true }

# Match Phira's one pinned audio library and select its backend per target.
[target.'cfg(not(any(target_os = "android", target_env = "ohos")))'.dependencies]
sasa = { git = "https://github.com/Mivik/sasa", rev = "e76229b2f68e4dc68b22bc375d2a92e8e7897691", default-features = false, features = ["cpal"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
sasa = { git = "https://github.com/Mivik/sasa", rev = "e76229b2f68e4dc68b22bc375d2a92e8e7897691", default-features = false, features = ["oboe"], optional = true }
jni = { version = "0.21.1", optional = true }
ndk-context = { version = "0.1.1", optional = true }

[target.'cfg(target_env = "ohos")'.dependencies]
sasa = { git = "https://github.com/Mivik/sasa", rev = "e76229b2f68e4dc68b22bc375d2a92e8e7897691", default-features = false, features = ["ohos"], optional = true }

# The examples are a separate Cargo workspace.
[patch."https://github.com/void-cat-0/miniquad"]
miniquad = { path = "../../miniquad" }

